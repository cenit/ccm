name: CI

on:
  push:
    branches: [master, main, 'dev/**', 'release/**']
  pull_request:
    branches: [master, main, 'dev/**', 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Module version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a ModuleVersion bump when the module changes
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          $changed = @(git diff --name-only "origin/$env:BASE_REF...HEAD")
          $moduleChanged = @($changed | Where-Object { $_ -match '^(CCM\.psm1|utils\.psm1|Public/|Private/)' })
          if ($moduleChanged.Count -eq 0) {
            Write-Host 'No module files changed.'
            exit 0
          }
          Write-Host "Module files changed:`n$($moduleChanged -join "`n")"
          $versionDiff = git diff "origin/$env:BASE_REF...HEAD" -- CCM.psd1 | Select-String -Pattern '^\+\s*ModuleVersion\s*='
          if (-not $versionDiff) {
            Write-Host '::error file=CCM.psd1::Module files changed but ModuleVersion in CCM.psd1 was not bumped (and add changelog.d/<version>.md).'
            exit 1
          }
          Write-Host "ModuleVersion bumped: $($versionDiff.Line.Trim())"

  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # VenvBootstrap tests exercise setup-venv.ps1 end to end and skip without uv.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
            Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Run Pester
        shell: pwsh
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Run.Exit = $true
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputFormat = 'NUnitXml'
          $cfg.TestResult.OutputPath = "pester-$env:RUNNER_OS_NAME.xml"
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.Path = @('./CCM.psm1', './Public/*.ps1', './Private/*.ps1')
          $cfg.CodeCoverage.OutputPath = "coverage-$env:RUNNER_OS_NAME.xml"
          $cfg.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-${{ runner.os }}
          path: |
            pester-${{ runner.os }}.xml
            coverage-${{ runner.os }}.xml
          if-no-files-found: warn
